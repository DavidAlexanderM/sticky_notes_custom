name: Build Windows Standalone Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows App
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Lifecycle Gate
        run: |
          python scripts/verify_lifecycle.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Upload Build Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
