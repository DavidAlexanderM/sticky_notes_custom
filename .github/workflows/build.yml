name: Build Windows Standalone Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows App
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Lifecycle Gate
        run: |
          python scripts/verify_lifecycle.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Generate Release Manifest for Mirror Feed
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/generate_release_manifest.py

      - name: Upload Build Artifact (ZIP & Manifest)
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-Windows-x64
          path: |
            dist/*.zip
            dist/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Create Primary GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/version.json
          generate_release_notes: true

      - name: Publish to Public Releases Mirror (On Tag)
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_MIRROR_TOKEN != ''
        uses: softprops/action-gh-release@v2
        env:
          RELEASE_MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        with:
          repository: DavidAlexanderM/sticky_notes_releases
          token: ${{ secrets.RELEASE_MIRROR_TOKEN }}
          files: |
            dist/*.zip
            dist/version.json
          generate_release_notes: true

      - name: Sync Manifest to Public Mirror Main Branch (On Tag)
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_MIRROR_TOKEN != ''
        shell: bash
        env:
          RELEASE_MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          git clone https://x-access-token:${RELEASE_MIRROR_TOKEN}@github.com/DavidAlexanderM/sticky_notes_releases.git mirror_repo
          cp dist/version.json mirror_repo/version.json
          cd mirror_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff-index --quiet HEAD || git commit -m "Update mirror feed manifest to ${{ github.ref_name }}"
          git push origin main || git push origin master || true

      - name: Public Mirror Advisory
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_MIRROR_TOKEN == ''
        env:
          RELEASE_MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          echo "::warning title=Public Mirror Not Configured::RELEASE_MIRROR_TOKEN secret not set in repository settings. The private release was created, but public mirror publication was skipped. See docs/PUBLIC_MIRROR_SETUP.md for 2-minute setup instructions."
